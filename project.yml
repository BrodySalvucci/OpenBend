# Optional: generate an Xcode project with `xcodegen generate` (brew install xcodegen).
# The Makefile / scripts/build.sh path only needs Command Line Tools.
name: OpenBend
options:
  bundleIdPrefix: com.openbend
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  OpenBend:
    type: application
    platform: macOS
    sources:
      - path: Sources/OpenBend
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.openbend.OpenBend
        PRODUCT_NAME: OpenBend
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO
