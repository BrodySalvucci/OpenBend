name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build app bundle
        run: ./scripts/build.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: OpenBend.app
          path: build/OpenBend.app
